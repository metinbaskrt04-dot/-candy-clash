<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ZOMBIE RUSH — 60</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a0c;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:linear-gradient(#0a0e10,#111719)}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;z-index:3;font-weight:700}
.box{background:#11191dcc;border:1px solid #344047;border-radius:12px;padding:9px 12px;font-size:14px}
#start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#070a0cf2}
.panel{width:min(88vw,560px);padding:28px;border:1px solid #3a4449;border-radius:22px;background:#0c1114;box-shadow:0 20px 60px #000}
h1{margin:0 0 8px;font-size:42px;letter-spacing:2px} h1 b{color:#ef4a4a}
button{width:100%;border:0;border-radius:14px;background:#c93232;color:#fff;font-weight:800;font-size:18px;padding:16px;margin-top:20px}
#controls{position:fixed;inset:0;z-index:4;pointer-events:none}
#joy{position:absolute;left:28px;bottom:28px;width:128px;height:128px;border-radius:50%;border:1px solid #ffffff22;background:#ffffff0d;pointer-events:auto}
#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#ffffff44;border:1px solid #fff3}
#fire{position:absolute;right:25px;bottom:25px;width:130px;height:130px;border-radius:50%;background:#b82e2ecc;border:1px solid #fff4;color:#fff;font-size:20px;font-weight:900;pointer-events:auto}
#dash{position:absolute;right:50px;bottom:170px;width:74px;height:74px;border-radius:50%;background:#30383dcc;border:1px solid #fff3;color:#fff;font-weight:800;pointer-events:auto}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font-size:28px;font-weight:900;text-align:center;text-shadow:0 3px 12px #000;display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="box">❤️ <span id="hp">100</span></div>
 <div class="box">⚡ Seviye <span id="lvl">1</span></div>
 <div class="box">🪙 <span id="coins">0</span></div>
 <div class="box">🔫 Glock · <span id="ammo">12</span></div>
</div>
<div id="start"><div class="panel">
 <h1><b>ZOMBIE</b> RUSH</h1>
 <div style="font-size:18px;color:#b9c0c4;margin-bottom:20px">60 dalgalık karanlık hayatta kalma modu.</div>
 <div style="line-height:1.8;color:#dce1e3">🎮 Sol joystick + ateş<br>🎯 Otomatik hedefleme<br>⬆️ Seviye ve silah geliştirme</div>
 <button id="startBtn">OYUNA BAŞLA</button>
 <div style="margin-top:12px;color:#899297;font-size:13px">Telefonu yatay kullanmak daha rahat olur.</div>
</div></div>
<div id="controls">
 <div id="joy"><div id="knob"></div></div>
 <button id="dash">DASH</button>
 <button id="fire">ATEŞ</button>
</div>
<div id="msg"></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr,playing=false,last=0,spawnT=0,shootT=0,inv=0;
let level=1,wave=1,hp=100,coins=0,ammo=12,maxAmmo=12,kills=0;
const p={x:0,y:0,r:15,s:210,vx:0,vy:0};
let zombies=[],bullets=[],parts=[];
const joy={x:0,y:0,active:false,id:null};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!p.x){p.x=W/2;p.y=H/2}}
addEventListener('resize',resize);resize();

function el(id){return document.getElementById(id)}
function ui(){el('hp').textContent=Math.max(0,Math.ceil(hp));el('lvl').textContent=level;el('coins').textContent=coins;el('ammo').textContent=ammo}
function start(){playing=true;el('start').style.display='none';p.x=W/2;p.y=H/2;hp=100;level=1;wave=1;coins=0;kills=0;ammo=maxAmmo;zombies=[];bullets=[];last=performance.now();requestAnimationFrame(loop)}
el('startBtn').onclick=start;

function joyMove(e){const r=el('joy').getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const m=Math.hypot(x,y),lim=39;if(m>lim){x=x/m*lim;y=y/m*lim}joy.x=x/lim;joy.y=y/lim;el('knob').style.transform=`translate(${x}px,${y}px)`}
el('joy').addEventListener('pointerdown',e=>{joy.active=true;el('joy').setPointerCapture(e.pointerId);joyMove(e)});
el('joy').addEventListener('pointermove',e=>{if(joy.active)joyMove(e)});
el('joy').addEventListener('pointerup',()=>{joy.active=false;joy.x=joy.y=0;el('knob').style.transform='translate(0,0)'});
let firing=false;
el('fire').addEventListener('pointerdown',()=>firing=true);el('fire').addEventListener('pointerup',()=>firing=false);el('fire').addEventListener('pointercancel',()=>firing=false);
el('dash').onclick=()=>{p.x=Math.max(20,Math.min(W-20,p.x+joy.x*180));p.y=Math.max(70,Math.min(H-20,p.y+joy.y*180));inv=.35};

function spawn(){
 const side=Math.floor(Math.random()*4),m=35;let x,y;
 if(side===0){x=Math.random()*W;y=-m}else if(side===1){x=W+m;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=H+m}else{x=-m;y=Math.random()*H}
 zombies.push({x,y,r:17+Math.random()*5,hp:2+level*.7,s:38+level*2,hit:0});
}
function shoot(){
 if(ammo<=0){ammo=maxAmmo;return}
 ammo--;
 let target=null,bd=Infinity;
 for(const z of zombies){const d=Math.hypot(z.x-p.x,z.y-p.y);if(d<bd){bd=d;target=z}}
 if(!target)return;
 const a=Math.atan2(target.y-p.y,target.x-p.x);
 bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*650,vy:Math.sin(a)*650,life:.9,d:2});
}
function loop(t){
 if(!playing)return;
 const dt=Math.min((t-last)/1000,.033);last=t;
 p.vx=joy.x*p.s;p.vy=joy.y*p.s;p.x=Math.max(18,Math.min(W-18,p.x+p.vx*dt));p.y=Math.max(70,Math.min(H-18,p.y+p.vy*dt));
 spawnT-=dt;shootT-=dt;inv-=dt;
 const maxZ=Math.min(10+level*2,32);
 if(spawnT<=0){if(zombies.length<maxZ)spawn();spawnT=Math.max(.25,1.15-level*.025)}
 if(firing&&shootT<=0){shoot();shootT=.16}
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
 bullets=bullets.filter(b=>b.life>0&&b.x>-50&&b.x<W+50&&b.y>-50&&b.y<H+50);
 for(const z of zombies){
   const a=Math.atan2(p.y-z.y,p.x-z.x),d=Math.hypot(p.x-z.x,p.y-z.y);z.x+=Math.cos(a)*z.s*dt;z.y+=Math.sin(a)*z.s*dt;
   if(d<z.r+p.r&&inv<=0){hp-=8;inv=.45}
   for(const b of bullets){if(Math.hypot(z.x-b.x,z.y-b.y)<z.r+5){z.hp-=b.d;b.life=0}}
 }
 for(let i=zombies.length-1;i>=0;i--)if(zombies[i].hp<=0){const z=zombies[i];zombies.splice(i,1);kills++;coins+=2;parts.push({x:z.x,y:z.y,t:.35});if(kills%8===0){level++;maxAmmo=12+level*2;ammo=maxAmmo}}
 if(hp<=0){playing=false;el('msg').style.display='block';el('msg').innerHTML='☠️ OYUN BİTTİ<br><button onclick="location.reload()">TEKRAR OYNA</button>'}
 ui();draw();requestAnimationFrame(loop)
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,60);ctx.lineTo(x,H);ctx.stroke()}for(let y=70;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(const z of zombies){ctx.fillStyle='#33452f';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();ctx.fillStyle='#d9df68';ctx.beginPath();ctx.arc(z.x-5,z.y-2,3,0,7);ctx.arc(z.x+5,z.y-2,3,0,7);ctx.fill();ctx.fillStyle='#c94141';ctx.fillRect(z.x-z.r,z.y-z.r-8,(2*z.r)*Math.max(0,z.hp/(2+level*.7)),4)}
 for(const b of bullets){ctx.fillStyle='#ffd86a';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}
 ctx.fillStyle=inv>0?'#8be3ff':'#e9e9e9';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
 ctx.fillStyle='#222';ctx.fillRect(p.x-4,p.y-25,8,20);
}
ui();
</script>
</body></html>
