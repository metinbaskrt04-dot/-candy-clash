<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZOMBIE RUSH</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#05090b;color:white;font-family:Arial,sans-serif;
 touch-action:none;
}
canvas{position:fixed;inset:0;width:100%;height:100%}

#hud{
 position:fixed;top:10px;left:10px;right:10px;
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:7px;z-index:5;
}
.stat{
 background:rgba(8,14,17,.88);
 border:1px solid #39464c;border-radius:14px;
 padding:10px 5px;text-align:center;font-weight:bold;
 font-size:15px;
}
.stat b{display:block;font-size:18px;margin-top:3px}

#wave{
 position:fixed;top:95px;left:50%;transform:translateX(-50%);
 z-index:5;background:rgba(8,14,17,.8);
 padding:7px 15px;border-radius:20px;
 font-weight:bold;
}

#joystick{
 position:fixed;left:18px;bottom:105px;
 width:150px;height:150px;border:2px solid #56646b;
 border-radius:50%;z-index:10;
 background:rgba(100,110,115,.08);
}
#stick{
 position:absolute;left:50%;top:50%;
 width:68px;height:68px;transform:translate(-50%,-50%);
 border-radius:50%;background:rgba(170,180,185,.45);
}

#fire{
 position:fixed;right:22px;bottom:72px;
 width:150px;height:150px;border-radius:50%;
 background:#bd292d;border:3px solid #ef5555;
 color:white;font-size:23px;font-weight:900;
 z-index:10;
}
#dash{
 position:fixed;right:190px;bottom:115px;
 width:105px;height:105px;border-radius:50%;
 background:#263238;border:2px solid #59666c;
 color:white;font-weight:bold;font-size:18px;z-index:10;
}
#reload{
 position:fixed;left:185px;bottom:115px;
 width:105px;height:105px;border-radius:50%;
 background:#263238;border:2px solid #59666c;
 color:white;font-weight:bold;font-size:16px;z-index:10;
}

#shop{
 display:none;position:fixed;inset:0;
 background:rgba(0,0,0,.82);z-index:30;
 align-items:center;justify-content:center;
 padding:20px;
}
.panel{
 width:min(430px,95vw);background:#10171a;
 border:2px solid #435158;border-radius:22px;
 padding:22px;text-align:center;
}
.panel h1{margin:0 0 10px;font-size:30px}
.up{
 width:100%;margin:8px 0;padding:14px;
 border:1px solid #4b5960;border-radius:12px;
 background:#1c272c;color:white;text-align:left;
 font-size:15px;
}
.up strong{display:block;font-size:18px;margin-bottom:4px}
#continue{
 width:100%;padding:15px;margin-top:12px;
 border:0;border-radius:12px;background:#e33438;
 color:white;font-size:18px;font-weight:bold;
}

#start{
 position:fixed;inset:0;background:rgba(3,7,9,.96);
 z-index:40;display:flex;align-items:center;justify-content:center;
 padding:20px;
}
.startbox{
 width:min(500px,94vw);padding:30px;
 border:2px solid #394950;border-radius:25px;
 background:#0d1417;text-align:center;
}
.logo{font-size:42px;font-weight:900}
.logo span{color:#ef4045}
.startbox p{color:#b9c3c7;font-size:17px;line-height:1.6}
#startBtn{
 width:100%;padding:18px;border:0;border-radius:14px;
 background:#df3539;color:#fff;font-size:22px;font-weight:900;
}
#gameover{
 display:none;position:fixed;inset:0;z-index:50;
 background:rgba(0,0,0,.9);
 align-items:center;justify-content:center;text-align:center;
}
.overbox{padding:30px}
.overbox h1{font-size:45px;color:#ef4145}
.overbox button{
 padding:16px 35px;border:0;border-radius:12px;
 background:#e33438;color:white;font-size:18px;font-weight:bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="stat">❤️<b id="hp">100</b></div>
 <div class="stat">⚡<b id="lvl">1</b></div>
 <div class="stat">🪙<b id="money">0</b></div>
 <div class="stat">🔫<b id="ammo">12/12</b></div>
</div>

<div id="wave">DALGA 1 / 60</div>

<div id="joystick"><div id="stick"></div></div>
<button id="reload">YENİLE</button>
<button id="dash">DASH</button>
<button id="fire">ATEŞ</button>

<div id="start">
 <div class="startbox">
  <div class="logo"><span>ZOMBIE</span> RUSH</div>
  <h2>60 DALGA • KARANLIKTA HAYATTA KAL</h2>
  <p>
   🎯 Otomatik hedefleme<br>
   🔫 Geliştirilebilir silahlar<br>
   🧟 Farklı zombi türleri<br>
   💥 Mermi ve parçacık efektleri<br>
   ⚡ Seviye ve para sistemi<br>
   👹 Boss zombiler
  </p>
  <button id="startBtn">OYUNA BAŞLA</button>
 </div>
</div>

<div id="shop">
 <div class="panel">
  <h1>⚡ GELİŞTİRME</h1>
  <div id="shopText"></div>
  <button id="continue">DALGAYA DEVAM ET</button>
 </div>
</div>

<div id="gameover">
 <div class="overbox">
  <h1>ÖLDÜN</h1>
  <p id="finalText"></p>
  <button onclick="location.reload()">TEKRAR OYNA</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,dpr;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

const $=id=>document.getElementById(id);

let running=false,gameOver=false;
let wave=1,score=0,money=0,level=1,xp=0;
let maxHp=100,hp=100;
let ammo=12,maxAmmo=12;
let damage=25,fireRate=380,bulletSpeed=720;
let moveSpeed=210,dashPower=700;
let lastTime=0,fireTimer=0,spawnTimer=0;
let reload=false,reloadTimer=0;
let zombies=[],bullets=[],particles=[],floating=[];
let keys={};
let joy={x:0,y:0,active:false,id:null};

const player={
 x:W/2,y:H/2,r:20,
 angle:0,dash:0,dashCooldown:0
};

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}
function rnd(a,b){return Math.random()*(b-a)+a}

function updateHUD(){
 $("hp").textContent=Math.max(0,Math.floor(hp));
 $("lvl").textContent=level;
 $("money").textContent=money;
 $("ammo").textContent=ammo+"/"+maxAmmo;
 $("wave").textContent="DALGA "+wave+" / 60";
}

function startGame(){
 $("start").style.display="none";
 running=true;
 lastTime=performance.now();
 requestAnimationFrame(loop);
}

$("startBtn").onclick=startGame;

function spawnZombie(){
 let side=Math.floor(Math.random()*4);
 let x,y;
 if(side===0){x=rnd(0,W);y=-40}
 if(side===1){x=W+40;y=rnd(0,H)}
 if(side===2){x=rnd(0,W);y=H+40}
 if(side===3){x=-40;y=rnd(0,H)}

 let roll=Math.random();
 let type="normal";

 if(wave>=8 && roll<.18) type="runner";
 if(wave>=15 && roll<.12) type="tank";
 if(wave%10===0 && zombies.filter(z=>z.boss).length===0 && roll<.08)
  type="boss";

 let z={
  x,y,
  type,
  r:20,
  hp:45+wave*8,
  maxHp:45+wave*8,
  speed:38+wave*1.5,
  damage:8,
  boss:false,
  color:"#687d3c"
 };

 if(type==="runner"){
  z.r=15;z.hp*=.65;z.speed=80+wave*2;z.damage=10;
  z.color="#9aa34a";
 }
 if(type==="tank"){
  z.r=30;z.hp*=3;z.speed=25;z.damage=18;
  z.color="#43552c";
 }
 if(type==="boss"){
  z.r=48;z.hp*=9;z.maxHp=z.hp;
  z.speed=28;z.damage=30;z.boss=true;
  z.color="#5b2525";
 }

 zombies.push(z);
}

function nearestZombie(){
 let best=null,bd=Infinity;
 for(const z of zombies){
  let d=dist(player,z);
  if(d<bd){bd=d;best=z}
 }
 return best;
}

function shoot(){
 if(!running||gameOver||reload||ammo<=0)return;

 let target=nearestZombie();
 if(!target)return;

 ammo--;
 fireTimer=fireRate;

 let a=Math.atan2(target.y-player.y,target.x-player.x);
 player.angle=a;

 bullets.push({
  x:player.x+Math.cos(a)*22,
  y:player.y+Math.sin(a)*22,
  vx:Math.cos(a)*bulletSpeed,
  vy:Math.sin(a)*bulletSpeed,
  life:1.2,
  damage
 });

 for(let i=0;i<5;i++){
  particles.push({
   x:player.x+Math.cos(a)*25,
   y:player.y+Math.sin(a)*25,
   vx:rnd(-80,80)+Math.cos(a)*150,
   vy:rnd(-80,80)+Math.sin(a)*150,
   life:.25,
   color:"#ffd54a",
   r:rnd(2,4)
  });
 }

 if(ammo<=0) startReload();
 updateHUD();
}

function startReload(){
 if(reload||ammo===maxAmmo)return;
 reload=true;
 reloadTimer=900;
}

$("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});

$("reload").addEventListener("pointerdown",e=>{
 e.preventDefault();
 startReload();
});

$("dash").addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(player.dashCooldown<=0){
  player.dash=.22;
  player.dashCooldown=2.5;
 }
});

function joystickStart(e){
 joy.active=true;joy.id=e.pointerId;
 updateJoy(e);
}
function joystickMove(e){
 if(joy.active&&e.pointerId===joy.id)updateJoy(e);
}
function joystickEnd(e){
 if(e.pointerId===joy.id){
  joy.active=false;joy.x=joy.y=0;
  $("stick").style.transform="translate(-50%,-50%)";
 }
}
function updateJoy(e){
 const r=$("joystick").getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=58;
 let len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joy.x=dx/max;joy.y=dy/max;
 $("stick").style.transform=
  `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}

$("joystick").addEventListener("pointerdown",joystickStart);
$("joystick").addEventListener("pointermove",joystickMove);
$("joystick").addEventListener("pointerup",joystickEnd);
$("joystick").addEventListener("pointercancel",joystickEnd);

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function gainXP(n){
 xp+=n;
 while(xp>=100){
  xp-=100;
  level++;
  maxHp+=8;
  hp=Math.min(maxHp,hp+20);
  damage+=4;
  money+=20;
  floating.push({
   x:player.x,y:player.y-35,
   text:"SEVİYE "+level,
   life:1.2,color:"#4de1ff"
  });
 }
}

function killZombie(z){
 score+=z.boss?1000:100;
 money+=z.boss?100:5;
 gainXP(z.boss?80:15);

 if(z.boss){
  for(let i=0;i<30;i++)particles.push({
   x:z.x,y:z.y,vx:rnd(-250,250),vy:rnd(-250,250),
   life:rnd(.4,1),color:"#ef3d45",r:rnd(3,8)
  });
 }

 floating.push({
  x:z.x,y:z.y,text:"+"+(z.boss?100:5)+" 🪙",
  life:.8,color:"#ffd84d"
 });
}

function hurt(n){
 hp-=n;
 if(hp<=0){
  hp=0;gameOver=true;running=false;
  $("finalText").textContent=
   "Dalga: "+wave+" • Skor: "+score+" • Para: "+money;
  $("gameover").style.display="flex";
 }
}

function nextWave(){
 if(wave>=60){
  running=false;
  $("shopText").innerHTML=
   "<h2>🏆 TEBRİKLER!</h2><p>60 dalgayı tamamladın!</p>";
  $("shop").style.display="flex";
  $("continue").textContent="YENİDEN OYNA";
  $("continue").onclick=()=>location.reload();
  return;
 }

 wave++;
 zombies=[];
 ammo=maxAmmo;
 hp=Math.min(maxHp,hp+15);
 updateHUD();
 showShop();
}

function showShop(){
 running=false;
 let upgrades=[
  ["🔫 HASAR +10","Silah hasarını artır","damage",60],
  ["⚡ ATEŞ HIZI","Daha hızlı ateş et","fireRate",80],
  ["❤️ CAN +30","Maksimum canı artır","maxHp",70],
  ["🏃 HIZ +20","Hareket hızını artır","moveSpeed",50]
 ];

 $("shopText").innerHTML=
  `<p>Para: 🪙 <b>${money}</b></p>`+
  upgrades.map((u,i)=>
   `<button class="up" data-i="${i}">
    <strong>${u[0]}</strong>${u[1]} — 🪙 ${u[3]}
   </button>`).join("");

 document.querySelectorAll(".up").forEach(btn=>{
  btn.onclick=()=>{
   let u=upgrades[+btn.dataset.i];
   if(money<u[3])return;
   money-=u[3];

   if(u[2]==="damage")damage+=10;
   if(u[2]==="fireRate")fireRate=Math.max(120,fireRate-55);
   if(u[2]==="maxHp"){maxHp+=30;hp+=30}
   if(u[2]==="moveSpeed")moveSpeed+=20;

   updateHUD();
   btn.style.opacity=".45";
   btn.disabled=true;
  };
 });

 $("shop").style.display="flex";
}

$("continue").onclick=()=>{
 $("shop").style.display="none";
 running=true;
 lastTime=performance.now();
 requestAnimationFrame(loop);
};

function update(dt){
 if(!running)return;

 if(fireTimer>0)fireTimer-=dt*1000;
 if(player.dashCooldown>0)player.dashCooldown-=dt;

 if(reload){
  reloadTimer-=dt*1000;
  if(reloadTimer<=0){
   reload=false;ammo=maxAmmo;updateHUD();
  }
 }

 let mx=joy.x,my=joy.y;
 if(keys["w"]||keys["arrowup"])my-=1;
 if(keys["s"]||keys["arrowdown"])my+=1;
 if(keys["a"]||keys["arrowleft"])mx-=1;
 if(keys["d"]||keys["arrowright"])mx+=1;

 let len=Math.hypot(mx,my);
 if(len>1){mx/=len;my/=len}

 let speed=moveSpeed;
 if(player.dash>0){
  speed=dashPower;
  player.dash-=dt;
 }

 player.x+=mx*speed*dt;
 player.y+=my*speed*dt;

 player.x=clamp(player.x,25,W-25);
 player.y=clamp(player.y,110,H-35);

 let target=nearestZombie();
 if(target){
  player.angle=Math.atan2(target.y-player.y,target.x-player.x);
  if(fireTimer<=0&&!reload)shoot();
 }

 spawnTimer-=dt;
 let maxZ=Math.min(5+wave*1.5,35);

 if(spawnTimer<=0&&zombies.length<maxZ){
  spawnZombie();
  spawnTimer=Math.max(.25,1.1-wave*.012);
 }

 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i];
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;

  let hit=false;

  for(let j=zombies.length-1;j>=0;j--){
   let z=zombies[j];
   if(Math.hypot(b.x-z.x,b.y-z.y)<z.r+5){
    z.hp-=b.damage;
    hit=true;

    for(let k=0;k<6;k++)particles.push({
     x:b.x,y:b.y,vx:rnd(-100,100),vy:rnd(-100,100),
     life:.35,color:"#d8e36a",r:rnd(2,4)
    });

    if(z.hp<=0){
     killZombie(z);
     zombies.splice(j,1);
    }
    break;
   }
  }

  if(hit||b.life<=0)bullets.splice(i,1);
 }

 for(const z of zombies){
  let a=Math.atan2(player.y-z.y,player.x-z.x);
  z.x+=Math.cos(a)*z.speed*dt;
  z.y+=Math.sin(a)*z.speed*dt;

  if(dist(z,player)<z.r+player.r){
   hurt(z.damage*dt);
   z.x-=Math.cos(a)*z.speed*dt*2;
   z.y-=Math.sin(a)*z.speed*dt*2;
  }
 }

 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vx*=.97;p.vy*=.97;p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }

 for(let i=floating.length-1;i>=0;i--){
  let f=floating[i];
  f.y-=25*dt;f.life-=dt;
  if(f.life<=0)floating.splice(i,1);
 }

 if(score>0 && zombies.length===0 && spawnTimer<0){
  if(wave<60)nextWave();
 }

 updateHUD();
}

function drawBackground(){
 ctx.fillStyle="#071013";
 ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="rgba(80,100,105,.13)";
 ctx.lineWidth=1;

 let grid=42;
 for(let x=0;x<W;x+=grid){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=80;y<H;y+=grid){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 let g=ctx.createRadialGradient(
  player.x,player.y,20,
  player.x,player.y,Math.max(W,H)*.65
 );
 g.addColorStop(0,"rgba(40,80,65,.12)");
 g.addColorStop(1,"rgba(0,0,0,.4)");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function drawZombie(z){
 ctx.save();
 ctx.translate(z.x,z.y);

 let a=Math.atan2(player.y-z.y,player.x-z.x);
 ctx.rotate(a);

 // shadow
 ctx.fillStyle="rgba(0,0,0,.4)";
 ctx.beginPath();ctx.ellipse(0,18,z.r*1.2,8,0,0,Math.PI*2);ctx.fill();

 // body
 ctx.fillStyle=z.color;
 ctx.beginPath();ctx.arc(0,0,z.r,0,Math.PI*2);ctx.fill();

 // arms
 ctx.strokeStyle=z.color;
 ctx.lineWidth=Math.max(7,z.r*.35);
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(-z.r*.55,-z.r*.3);
 ctx.lineTo(-z.r*1.1,-z.r*.8);
 ctx.moveTo(-z.r*.55,z.r*.3);
 ctx.lineTo(-z.r*1.1,z.r*.8);
 ctx.stroke();

 // face
 ctx.fillStyle="#dce86b";
 ctx.beginPath();
 ctx.arc(z.r*.35,-z.r*.3,z.r*.16,0,Math.PI*2);ctx.fill();
 ctx.beginPath();
 ctx.arc(z.r*.35,z.r*.3,z.r*.16,0,Math.PI*2);ctx.fill();

 // health bar
 ctx.rotate(-a);
 let bw=z.r*2.2;
 ctx.fillStyle="#351b1d";
 ctx.fillRect(-bw/2,-z.r-12,bw,5);
 ctx.fillStyle=z.boss?"#ff4048":"#e33e43";
 ctx.fillRect(-bw/2,-z.r-12,bw*(z.hp/z.maxHp),5);

 if(z.boss){
  ctx.fillStyle="#ff5555";
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.fillText("BOSS",0,-z.r-18);
 }

 ctx.restore();
}

function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);

 // shadow
 ctx.fillStyle="rgba(0,0,0,.5)";
 ctx.beginPath();ctx.ellipse(0,17,25,8,0,0,Math.PI*2);ctx.fill();

 ctx.rotate(player.angle);

 // weapon
 ctx.fillStyle="#8f989b";
 ctx.fillRect(8,-5,30,10);
 ctx.fillStyle="#22292d";
 ctx.fillRect(30,-4,20,8);

 // body
 ctx.fillStyle="#d7dce0";
 ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.fill();

 ctx.fillStyle="#20282c";
 ctx.beginPath();ctx.arc(5,-3,5,0,Math.PI*2);ctx.fill();

 ctx.restore();

 if(hp<maxHp){
  ctx.fillStyle="#291c1e";
  ctx.fillRect(player.x-25,player.y-34,50,5);
  ctx.fillStyle="#44d16a";
  ctx.fillRect(player.x-25,player.y-34,50*(hp/maxHp),5);
 }
}

function draw(){
 drawBackground();

 for(const b of bullets){
  ctx.fillStyle="#ffd34d";
  ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
 }

 for(const z of zombies)drawZombie(z);
 drawPlayer();

 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;

 for(const f of floating){
  ctx.globalAlpha=Math.max(0,f.life);
  ctx.fillStyle=f.color;
  ctx.font="bold 16px Arial";
  ctx.textAlign="center";
  ctx.fillText(f.text,f.x,f.y);
 }
 ctx.globalAlpha=1;

 // wave progress
 let progress=Math.min(1,score/Math.max(1,wave*300));
 ctx.fillStyle="rgba(255,255,255,.08)";
 ctx.fillRect(10,H-8,W-20,4);
 ctx.fillStyle="#e33d42";
 ctx.fillRect(10,H-8,(W-20)*progress,4);
}

function loop(t){
 if(!running)return;
 let dt=Math.min(.033,(t-lastTime)/1000);
 lastTime=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

updateHUD();
</script>
</body>
</html>
